services:
  - type: web
    name: image-to-3d
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: TRIPO_API_KEY
        sync: false
      - key: RODIN_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
